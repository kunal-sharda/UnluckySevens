name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  practical-gate:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve doc freshness base
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "DOC_FRESHNESS_BASE=origin/${{ github.base_ref }}" >> "$GITHUB_ENV"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            echo "DOC_FRESHNESS_BASE=HEAD^" >> "$GITHUB_ENV"
          else
            echo "DOC_FRESHNESS_BASE=HEAD" >> "$GITHUB_ENV"
          fi

      - name: Check doc freshness
        run: make doc-freshness DOC_FRESHNESS_BASE="$DOC_FRESHNESS_BASE"

      - name: Check repository harness
        run: make harness-check-tests harness-audit

      - name: Install Tuist 4.146.0
        run: |
          brew tap tuist/tuist
          brew install --formula tuist@4.146.0
          brew link --overwrite tuist@4.146.0

      - name: Print toolchain versions
        run: |
          tuist version
          swift --version
          xcodebuild -version

      - name: Test ULS_CoreGame
        run: swift test --package-path Packages/ULS_CoreGame --skip ULS_CoreGameEvals

      - name: Run ULS_CoreGame deterministic evals
        run: swift test --package-path Packages/ULS_CoreGame --filter ULS_CoreGameEvals

      - name: Test ULS_Transport
        run: swift test --package-path Packages/ULS_Transport

      - name: Build MessagesExtension
        run: make build DOC_FRESHNESS_BASE="$DOC_FRESHNESS_BASE"
